version: "3"

tasks:
  default:
    cmds:
      - task build

  gen:
    cmds:
      - task gen-go
      - task gen-gorm
      - task gen-gql-enums
      - task gen-gql
      - task gen-protoc
      - task gen-mockery
      - task gen-classifier-schema

  gen-go:
    cmds:
      - go generate ./...

  gen-gorm:
    cmds:
      - go run ./internal/dev gorm gen

  gen-gql-enums:
    cmds:
      - go run ./internal/gql/enums/gen/genenums.go

  gen-gql:
    cmds:
      - go run github.com/99designs/gqlgen generate --config ./internal/gql/gqlgen.yml

  gen-protoc:
    cmds:
      - protoc --go_out=. ./internal/protobuf/bitmagnet.proto

  gen-mockery:
    cmds:
      - go run github.com/vektra/mockery/v2

  gen-classifier-schema:
    cmds:
      - go run . classifier schema --format json > ./schemas/classifier-0.1.json

  lint:
    cmds:
      - task lint-golangci
      - task lint-ui
      - task lint-prettier

  lint-golangci:
    cmds:
      - golangci-lint run --timeout=10m

  install-tools:
    cmds:
      - npm ci
      - task install-ui

  lint-prettier:
    cmds:
      # The repository's pinned Prettier, not one from PATH: markdown formatting differs
      # between 3.x releases, so a stray version passes locally and fails CI.
      # Requires `task install-tools`.
      - ./node_modules/.bin/prettier --check .

  test:
    cmds:
      - task test-go
      - task test-bundled-ui
      - task test-ui

  test-go:
    cmds:
      - go test ./...

  test-ui:
    dir: ./webui
    cmds:
      - npm test

  lint-ui:
    dir: ./webui
    cmds:
      - ./node_modules/.bin/elm-format --validate src tests review/src
      - npm run review

  migrate:
    cmds:
      - go run ./internal/dev migrate up

  build:
    cmds:
      - task build-ui
      - go build -tags webui -ldflags "-X github.com/bitmagnet-io/bitmagnet/internal/version.GitTag=$(git describe --tags --always --dirty)"

  build-backend:
    cmds:
      - go build -ldflags "-X github.com/bitmagnet-io/bitmagnet/internal/version.GitTag=$(git describe --tags --always --dirty)"

  install-ui:
    dir: ./webui
    cmds:
      - npm ci

  build-ui:
    cmds:
      - task install-ui
      - cd webui && npm run build:optimize

  test-bundled-ui:
    cmds:
      - task build-ui
      - go test -tags webui ./internal/httpserver/static ./internal/app/appfx

  build-website:
    dir: ./website
    cmds:
      - npm ci
      - npm run build

  serve-website:
    dir: ./website
    cmds:
      - npm ci
      - npm run dev

  export-data:
    cmds:
      - |
        pg_dump \
        --column-inserts \
        --data-only \
        --on-conflict-do-nothing \
        --rows-per-insert=1000 \
        --table=metadata_sources \
        --table=content \
        --table=content_attributes \
        --table=content_collections \
        --table=content_collections_content \
        --table=torrent_sources \
        --table=torrents \
        --table=torrent_files \
        --table=torrent_hints \
        --table=torrent_contents \
        --table=torrent_tags \
        --table=torrents_torrent_sources \
        --table=key_values \
        bitmagnet \
        > export.sql

  create-migration:
    dir: ./migrations
    cmds:
      - goose -s create {{.NAME}} sql
    vars:
      NAME: migration
