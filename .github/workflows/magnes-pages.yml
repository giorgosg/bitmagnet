name: Magnes documentation

on:
  pull_request:
    paths:
      [
        "website/**",
        "schemas/**",
        "**/*.md",
        "**/*.mdx",
        ".github/workflows/magnes-pages.yml",
      ]
  push:
    branches: [trunk]
    paths:
      [
        "website/**",
        "schemas/**",
        "**/*.md",
        "**/*.mdx",
        ".github/workflows/magnes-pages.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magnes-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.repository == 'giorgosg/magnes' && github.ref == 'refs/heads/trunk'
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request' && github.repository == 'giorgosg/magnes' && github.ref == 'refs/heads/trunk'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
