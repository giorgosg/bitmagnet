name: Docker checks

on:
  push:
    branches:
      - main
      - trunk
      - develop
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - "ci.Dockerfile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/docker-checks.yml"
  pull_request:
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - "ci.Dockerfile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/docker-checks.yml"
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Dockerfile runs `git describe`, which needs history and tags.
          fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build release image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ci.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Build local image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
