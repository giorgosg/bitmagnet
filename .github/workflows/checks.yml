name: Checks

on:
  push:
    branches:
      - main
      - trunk
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Pull requests are tested as merge commits, so the push created by GitHub's
    # merge button would repeat the exact result. Direct pushes still run.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install formatting tools
        run: |
          nix develop --ignore-environment --command task install-tools
      - name: Run linters
        run: |
          nix develop --ignore-environment --keep HOME . --command task lint

  test:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    # The Ubuntu image has been downgraded and pinned for the `test` and `generated` jobs as they are broken on 24.04
    runs-on: ubuntu-22.04
    services:
      # Integration tests provision their own throwaway databases on this
      # server; see internal/database/dbtest. Without TEST_POSTGRES_DSN they
      # skip, so the suite still runs offline.
      postgres:
        image: postgres:16-alpine
        env:
          PGUSER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Go tests
        run: |
          nix develop --ignore-environment --keep HOME --keep TEST_POSTGRES_DSN . --command task test-go
        env:
          TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/postgres

  ui:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bitmagnet_ui_smoke
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the default executable and test the Elm UI
        run: |
          nix develop --ignore-environment --keep HOME . --command task build
          nix develop --ignore-environment --keep HOME . --command task test-ui
          nix develop --ignore-environment --keep HOME . --command go test -tags webui ./internal/httpserver/static ./internal/app/appfx
      - name: Install browser
        run: nix develop --ignore-environment --keep HOME . --command sh -c 'cd webui && npx playwright install --with-deps chromium'
      - name: Test the packaged UI in a browser
        run: nix develop --ignore-environment --keep HOME --keep BUNDLED_UI_POSTGRES_DSN . --command sh -c 'cd webui && npm run test:e2e:bundled'
        env:
          BUNDLED_UI_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/bitmagnet_ui_smoke

  # Regenerate Go code and schemas to check that everything is committed.
  generated:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    runs-on: ubuntu-22.04
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres:16-alpine
        # Provide the password for postgres
        env:
          PGUSER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bitmagnet
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply database migrations and generate code
        run: |
          nix develop --ignore-environment --keep HOME --keep POSTGRES_PASSWORD . --command task migrate
          nix develop --ignore-environment --keep HOME --keep POSTGRES_PASSWORD . --command task gen
          nix develop --ignore-environment --keep HOME . --command go fmt ./...
        env:
          POSTGRES_PASSWORD: postgres
      - name: Check nothing changed
        run: git diff --exit-code
