<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Repeated from the stylesheet so the browser knows before any CSS arrives, which
         is what avoids a white flash on a dark system while loading. -->
    <meta name="color-scheme" content="light dark" />
    <!-- Set this to the static mount (for example /magnes/) in a deployed copy. -->
    <base href="/" />
    <title>magnes</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Optional, gitignored, and absent by default: see config.example.js. -->
    <script src="config.js"></script>
    <script src="main.js"></script>
    <script>
      // The API address and mount path are runtime configuration, not build inputs:
      // the same bundle works at the origin root or beneath bitmagnet's static mount.
      const app = Elm.Main.init({
        flags: {
          apiUrl: window.MAGNES_API_URL || "/graphql",
          basePath: window.MAGNES_BASE_PATH || "",
        },
      });

      // Authentication changes carry no credential. The HttpOnly cookie is owned by
      // bitmagnet; tabs merely tell one another to refresh their canonical Identity.
      if ("BroadcastChannel" in window) {
        const authentication = new BroadcastChannel("magnes-authentication");
        app.ports.authenticationChanged.subscribe(() => {
          authentication.postMessage("changed");
        });
        authentication.addEventListener("message", () => {
          app.ports.authenticationChanges.send(null);
        });
      }
    </script>
  </body>
</html>
